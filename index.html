<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Clicker (Version Extensible)</title>
    <style>
        /* --- Styles Généraux (Mobile First) --- */
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #0f1821; 
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow-y: auto; 
            padding: 10px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column; 
            width: 100%;
            background-color: #2c3e50; 
            border: 2px solid #1a242f;
            border-radius: 5px;
            max-width: 1000px;
        }

        #left-panel {
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #1a242f; 
        }

        #score-display {
            font-size: 36px; 
            color: #f1c40f; 
        }

        #cps-display, #cpc-display {
            font-size: 16px;
        }

        #click-button {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, filter 0.3s;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
            margin: 10px 0;
        }

        .brain-emoji {
            font-size: 150px; 
            display: block;
        }

        #right-panel {
            padding: 10px;
            overflow-y: auto; 
            height: auto; 
        }

        .control-container h3 {
            border-bottom: 1px solid #1a242f;
            padding-bottom: 5px;
            margin-top: 15px;
            color: #61dafb; 
        }

        button {
            padding: 10px;
            background-color: #34495e; 
            border: 1px solid #1a242f;
            border-radius: 0; 
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin: 3px 0;
            width: 100%;
            text-align: left;
            transition: background-color 0.2s;
        }
        
        #minigame-main-button {
            background-color: #2ecc71; 
            text-align: center;
        }

        button:hover {
            background-color: #416080;
        }

        button:disabled {
            background-color: #34495e80; 
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* --- Styles du Pop-up Mini-Jeu --- */
        #minigame-popup { display: none; /* ... inchangé ... */ }
        #minigame-content { /* ... inchangé ... */ }
        .challenge-button { /* ... inchangé ... */ }
        #minigame-click-button { /* ... inchangé ... */ }

        /* --- Media Query pour PC et Grands Écrans (>= 768px) --- */
        @media (min-width: 768px) {
            #game-wrapper {
                flex-direction: row; 
            }
            #left-panel { flex-basis: 60%; border-right: 2px solid #1a242f; border-bottom: none; }
            #right-panel { flex-basis: 40%; height: 600px; }
            #score-display { font-size: 48px; }
            .brain-emoji { font-size: 180px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="left-panel">
            <h1>Brainrot Clicker</h1>
            <div id="stats-display">
                <!-- Texte de l'image -->
                <div id="score-display"><span id="score">0</span> points</div>
                <div id="cpc-display">Points/Clic: <span id="cpc">1</span></div>
                <div id="cps-display">Auto-clics/sec: <span id="cps">0</span></div>
            </div>
            
            <button id="click-button" onclick="augmenterScoreManuel()">
                <span id="current-skin" class="brain-emoji">🧠</span>
            </button>
            <!-- Texte de l'image -->
            <p><small id="save-status">Jeu non sauvegardé..</small></p>
        </div>

        <div id="right-panel">
             <div id="cpc-upgrades-container" class="control-container">
                <h3>Améliorations Clic (CPC)</h3>
                <div id="cpc-upgrade-shop">
                    <!-- Les boutons d'améliorations CPC sont générés par JS -->
                </div>
            </div>

            <div id="upgrades-container" class="control-container">
                <h3>Améliorations CPS</h3>
                <div id="upgrade-shop">
                    <!-- Les boutons d'améliorations sont générés par JS -->
                </div>
            </div>
            
            <!-- Texte de l'image -->
            <button id="minigame-main-button" onclick="showMinigameChoices()">
                Lancer Défi de Vol (Prêt) ⚡
            </button>

            <div id="skins-container" class="control-container">
                <h3>Skins Multiplicateurs</h3>
                <div id="skin-shop">
                    <!-- Les boutons de skin sont générés par JS -->
                </div>
            </div>

            <!-- Texte de l'image -->
            <button id="reset-button" onclick="resetGame()">
                Réinitialiser le jeu
            </button>
        </div>
    </div>

    <!-- Interface du Pop-up de Choix et Défi -->
    <div id="minigame-popup">
        <div id="minigame-content">
            <h2 id="minigame-title">Choisissez votre défi de vol</h2>
            <div id="challenge-choices">
                <button class="challenge-button" onclick="startChallenge(20, 5, 50)">20 clics en 5s (+50 points)</button>
                <button class="challenge-button" onclick="startChallenge(40, 10, 100)">40 clics en 10s (+100 points)</button>
                <button class="challenge-button" onclick="startChallenge(80, 25, 350)">80 clics en 25s (+350 points)</button>
            </div>
            <div id="challenge-active-area" style="display: none;">
                <p>Objectif: <span id="clicks-required-display">0</span> clics | Temps restant: <span id="time-left">0.0</span>s</p>
                <p>Comptage : <span id="clicks-made">0</span></p>
                <button id="minigame-click-button" onclick="handleMinigameClick()"> ⚡ </button>
            </div>
        </div>
    </div>


    <script>
        // Logique JavaScript
        let score = 0;
        let clicksPerClick = 1; 
        let baseAutoClickRate = 0; 
        let skinMultiplier = 1; 
        let lastCooldownEndTimestamp = 0; 
        let minigameActive = false;
        let minigameClicksMade = 0;
        let minigameInterval;
        let currentChallenge = {};

        const cpcUpgrades = [
            { id: 'muscles', name: 'Doigts Musclés', baseCost: 50, cpcBoost: 1, count: 0 },
            { id: 'optic', name: 'Souris Optique', baseCost: 500, cpcBoost: 5, count: 0 },
            { id: 'nano', name: 'Nanotechnologie', baseCost: 5000, cpcBoost: 25, count: 0 },
            { id: 'quantum', name: 'Clic Quantique', baseCost: 50000, cpcBoost: 100, count: 0 },
            { id: 'legend', name: 'Dextérité Légendaire', baseCost: 500000, cpcBoost: 500, count: 0 },
        ];

        const upgrades = [
            { id: 'assistant', name: 'Assistant', baseCost: 10, cps: 1, count: 0 },
            { id: 'generator', name: 'Générateur', baseCost: 100, cps: 10, count: 0 },
            { id: 'factory', name: 'Usine à Cerveaux', baseCost: 500, cps: 50, count: 0 },
            { id: 'lab', name: 'Laboratoire Secret', baseCost: 2000, cps: 100, count: 0 },
            { id: 'server', name: 'Serveur IA', baseCost: 10000, cps: 200, count: 0 },
            { id: 'farm', name: 'Ferme de Minage', baseCost: 50000, cps: 500, count: 0 },
            { id: 'portal', name: 'Portes Spatio-temporelles', baseCost: 250000, cps: 1000, count: 0 },
            { id: 'reality', name: 'Machine à Réalité', baseCost: 1000000, cps: 5000, count: 0 },
            { id: 'singularity', name: 'Singularité', baseCost: 5000000, cps: 10000, count: 0 },
            { id: 'nexus', name: 'Nexus Cosmique', baseCost: 25000000, cps: 50000, count: 0 },
            { id: 'galaxy', name: 'Galaxie d\'Étoiles', baseCost: 100000000, cps: 100000, count: 0 },
            { id: 'universe', name: 'Univers Virtuel', baseCost: 500000000, cps: 500000, count: 0 },
            { id: 'metaverse', name: 'Métavers Infini', baseCost: 2500000000, cps: 1000000, count: 0 },
        ];

        const skins = [
            { id: 'normal', emoji: '🧠', cost: 0, multiplier: 1, owned: true },
            { id: 'gold', emoji: '💛', cost: 1000, multiplier: 2, owned: false },
            { id: 'rainbow', emoji: '🌈', cost: 10000, multiplier: 5, owned: false },
            { id: 'diamond', emoji: '💎', cost: 100000, multiplier: 10, owned: false },
            { id: 'cyborg', emoji: '🤖', cost: 1000000, multiplier: 25, owned: false },
            { id: 'alien', emoji: '👽', cost: 10000000, multiplier: 50, owned: false }
        ];
        let currentSkin = skins.find(s => s.id === 'normal');

        const scoreElement = document.getElementById('score');
        const minigameMainButton = document.getElementById('minigame-main-button');
        const saveStatusElement = document.getElementById('save-status');
        const cpcUpgradeShopElement = document.getElementById('cpc-upgrade-shop');
        const upgradeShopElement = document.getElementById('upgrade-shop');
        const skinShopElement = document.getElementById('skin-shop');


        function augmenterScoreManuel() { score += clicksPerClick; updateDisplay(); }
        function augmenterScoreAutomatique() { let totalCps = baseAutoClickRate * skinMultiplier; score += totalCps; updateDisplay(); }
        function recalculateTotals() {
             clicksPerClick = 1 + cpcUpgrades.reduce((total, upgrade) => total + (upgrade.count * upgrade.cpcBoost), 0);
             baseAutoClickRate = upgrades.reduce((total, upgrade) => total + (upgrade.count * upgrade.cps), 0);
        }
        
        // --- Logique Mini-Jeu / Cooldown (inchangée) ---
        function showMinigameChoices() { /* ... */ if (minigameMainButton.disabled) return; document.getElementById('minigame-popup').style.display = 'flex'; document.getElementById('challenge-choices').style.display = 'block'; document.getElementById('challenge-active-area').style.display = 'none'; }
        function startChallenge(requiredClicks, timeLimitSeconds, rewardAmount) { /* ... */ if (minigameActive) return; document.getElementById('challenge-choices').style.display = 'none'; document.getElementById('challenge-active-area').style.display = 'block'; currentChallenge = { required: requiredClicks, time: timeLimitSeconds, reward: rewardAmount }; minigameActive = true; minigameClicksMade = 0; document.getElementById('time-left').textContent = currentChallenge.time.toFixed(1); document.getElementById('clicks-made').textContent = minigameClicksMade; document.getElementById('clicks-required-display').textContent = currentChallenge.required; let timeLeft = currentChallenge.time; minigameInterval = setInterval(() => { timeLeft -= 0.1; document.getElementById('time-left').textContent = timeLeft.toFixed(1); if (timeLeft <= 0) { clearInterval(minigameInterval); endMinigame(false); } }, 100); }
        function handleMinigameClick() { /* ... */ if (!minigameActive) return; minigameClicksMade++; document.getElementById('clicks-made').textContent = minigameClicksMade; if (minigameClicksMade >= currentChallenge.required) { clearInterval(minigameInterval); endMinigame(true); } }
        function endMinigame(won) { /* ... */ minigameActive = false; document.getElementById('minigame-popup').style.display = 'none'; if (won) { score += currentChallenge.reward; alert(`VICTOIRE ! Vous avez volé ${currentChallenge.reward.toLocaleString()} points bonus !`); } else { alert("TEMPS ÉCOULÉ ou objectif non atteint ! Vous n'avez rien volé cette fois-ci."); } applyCooldown(); updateDisplay(); }
        function applyCooldown() { /* ... */ const COOLDOWN_TIME_MS = 900000; lastCooldownEndTimestamp = Date.now() + COOLDOWN_TIME_MS; minigameMainButton.disabled = true; const countdownInterval = setInterval(() => { const msLeft = lastCooldownEndTimestamp - Date.now(); if (msLeft <= 0) { clearInterval(countdownInterval); minigameMainButton.disabled = false; minigameMainButton.textContent = "Lancer Défi de Vol (Prêt) 🧠⚡"; } else { const minutes = Math.floor(msLeft / 60000); const seconds = Math.floor((msLeft % 60000) / 1000); minigameMainButton.textContent = `Prochain vol dans ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`; } }, 1000); }
        
        // --- Logique de Sauvegarde/Chargement (inchangée) ---
        function saveGame() { /* ... */ const saveData = { score: score, clicksPerClick: clicksPerClick, baseAutoClickRate: baseAutoClickRate, skinMultiplier: skinMultiplier, upgrades: upgrades, cpcUpgrades: cpcUpgrades, skins: skins, currentSkinId: currentSkin.id, lastCooldownEndTimestamp: lastCooldownEndTimestamp }; localStorage.setItem('brainrotClickerSave', JSON.stringify(saveData)); saveStatusElement.textContent = "Jeu sauvegardé automatiquement !"; setTimeout(() => saveStatusElement.textContent = "Jeu non sauvegardé..", 3000); }
        function loadGame() { /* ... */ const savedData = JSON.parse(localStorage.getItem('brainrotClickerSave')); if (savedData) { score = savedData.score || 0; skinMultiplier = savedData.skinMultiplier || 1; lastCooldownEndTimestamp = savedData.lastCooldownEndTimestamp || 0; if (savedData.upgrades) savedData.upgrades.forEach(su => { const lu = upgrades.find(u => u.id === su.id); if (lu) lu.count = su.count; }); if (savedData.cpcUpgrades) savedData.cpcUpgrades.forEach(sc => { const lc = cpcUpgrades.find(u => u.id === sc.id); if (lc) lc.count = sc.count; }); if (savedData.skins) savedData.skins.forEach(ss => { const ls = skins.find(s => s.id === ss.id); if (ls) ls.owned = ss.owned; }); const savedCurrentSkin = skins.find(s => s.id === savedData.currentSkinId); if (savedCurrentSkin) useSkin(savedCurrentSkin.id); recalculateTotals(); if (lastCooldownEndTimestamp > Date.now()) { applyCooldown(); } else { minigameMainButton.disabled = false; minigameMainButton.textContent = "Lancer Défi de Vol (Prêt) 🧠⚡"; } updateDisplay(); saveStatusElement.textContent = "Partie chargée !"; setTimeout(() => saveStatusElement.textContent = "Jeu non sauvegardé..", 3000); } else { resetGame(); saveStatusElement.textContent = "Nouvelle partie commencée."; setTimeout(() => saveStatusElement.textContent = "Jeu non sauvegardé..", 3000); } }
        
        // --- Logique d'achat CPC et Rendu (inchangée) ---
        function buyCpcUpgrade(upgradeId) { const upgrade = cpcUpgrades.find(u => u.id === upgradeId); const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.2, upgrade.count)); if (score >= currentCost) { score -= currentCost; upgrade.count += 1; recalculateTotals(); updateDisplay(); renderCpcUpgradeShop(); } }
        function renderCpcUpgradeShop() { cpcUpgradeShopElement.innerHTML = ''; cpcUpgrades.forEach(upgrade => { const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.2, upgrade.count)); const button = document.createElement('button'); button.innerHTML = `${upgrade.name} (+${upgrade.cpcBoost} CPC) (Coût: ${currentCost.toLocaleString()}, Possédé: ${upgrade.count})`; button.onclick = () => buyCpcUpgrade(upgrade.id); button.disabled = (score < currentCost); cpcUpgradeShopElement.appendChild(button); }); }
        
        // --- Logique d'achat CPS et Rendu (inchangée) ---
        function buyUpgrade(upgradeId) { const upgrade = upgrades.find(u => u.id === upgradeId); const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count)); if (score >= currentCost) { score -= currentCost; upgrade.count += 1; recalculateTotals(); updateDisplay(); renderUpgradeShop(); } }
        function renderUpgradeShop() { upgradeShopElement.innerHTML = ''; upgrades.forEach(upgrade => { const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count)); const button = document.createElement('button'); button.innerHTML = `${upgrade.name} (+${upgrade.cps} CPS) (Coût: ${currentCost.toLocaleString()}, Possédé: ${upgrade.count})`; button.onclick = () => buyUpgrade(upgrade.id); button.disabled = (score < currentCost); upgradeShopElement.appendChild(button); }); }
        
        // --- Logique des Skins et Rendu (inchangée) ---
        function buySkin(skinId) { const skin = skins.find(s => s.id === skinId); if (skin && !skin.owned && score >= skin.cost) { score -= skin.cost; skin.owned = true; useSkin(skinId); updateDisplay(); renderSkinShop(); } }
        function useSkin(skinId) { const skin = skins.find(s => s.id === skinId); if (skin && skin.owned) { currentSkin = skin; skinMultiplier = skin.multiplier; document.getElementById('current-skin').textContent = skin.emoji; updateDisplay(); } }
        function renderSkinShop() { skinShopElement.innerHTML = ''; skins.forEach(skin => { const button = document.createElement('button'); if (skin.owned) { button.textContent = `Utiliser ${skin.emoji} (x${skin.multiplier} CPS)`; button.onclick = () => useSkin(skin.id); if (currentSkin.id === skin.id) { button.disabled = true; } } else { button.textContent = `Acheter ${skin.emoji} (Coût: ${skin.cost.toLocaleString()}, x${skin.multiplier} CPS)`; button.onclick = () => buySkin(skin.id); button.disabled = (score < skin.cost); } skinShopElement.appendChild(button); }); }


        function resetGame() {
            score = 0; clicksPerClick = 1; baseAutoClickRate = 0; skinMultiplier = 1; lastCooldownEndTimestamp = 0;
            upgrades.forEach(u => u.count = 0); cpcUpgrades.forEach(u => u.count = 0); 
            skins.forEach((s, index) => s.owned = (index === 0)); useSkin('normal');
            minigameMainButton.disabled = false; minigameMainButton.textContent = "Lancer Défi de Vol (Prêt) ⚡";
            localStorage.removeItem('brainrotClickerSave'); recalculateTotals(); 
            updateDisplay(); renderUpgradeShop(); renderCpcUpgradeShop(); renderSkinShop();
        }

        function updateDisplay() {
            scoreElement.textContent = score.toLocaleString();
            document.getElementById('cps').textContent = (baseAutoClickRate * skinMultiplier).toLocaleString(); 
            document.getElementById('cpc').textContent = clicksPerClick;
            
            // Met à jour l'état des boutons pour qu'ils soient vides si aucun achat n'est fait
            renderUpgradeShop();
            renderCpcUpgradeShop(); 
            renderSkinShop(); 
        }

        setInterval(augmenterScoreAutomatique, 1000);
        setInterval(saveGame, 10000); 
        
        loadGame(); 
        updateDisplay();
    </script>

</body>
</html>
