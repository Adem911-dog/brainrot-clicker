<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Clicker (Fonctionnel)</title>
    <style>
        /* --- Styles Généraux (Mobile First) --- */
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #0f1821; 
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow-y: auto; 
            padding: 10px;
        }

        #game-wrapper {
            display: flex; flex-direction: column; width: 100%; background-color: #2c3e50; border: 2px solid #1a242f; border-radius: 5px; max-width: 1000px;
        }
        #left-panel { padding: 10px; text-align: center; border-bottom: 2px solid #1a242f; }
        #score-display { font-size: 36px; color: #f1c40f; }
        #cps-display, #cpc-display { font-size: 16px; }
        #click-button { 
            background: none; border: none; cursor: pointer; transition: transform 0.1s, filter 0.3s; 
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5)); margin: 10px 0; 
        }
        /* Cette classe s'applique à l'emoji réel qui a la taille visuelle */
        .brain-emoji { font-size: 150px; display: block; }
        #right-panel { padding: 10px; overflow-y: auto; height: auto; }
        .control-container h3 { border-bottom: 1px solid #1a242f; padding-bottom: 5px; margin-top: 15px; color: #61dafb; }
        button, .discord-link-button { /* Appliquer styles aux boutons ET au lien Discord */
            padding: 10px; background-color: #34495e; border: 1px solid #1a242f; border-radius: 0; color: white; cursor: pointer; font-size: 14px; margin: 3px 0; width: 100%; text-align: left; transition: background-color 0.2s;
            text-decoration: none; /* Enlève le soulignement du lien */
            display: block; /* Force le lien à prendre 100% de la largeur comme les boutons */
            box-sizing: border-box; /* S'assure que padding/border sont inclus dans la largeur 100% */
        }
        #minigame-main-button { background-color: #2ecc71; text-align: center; }
        #discord-button { background-color: #5865F2; text-align: center; }
        button:hover, .discord-link-button:hover { background-color: #416080; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        
        /* Style pour l'événement Cerveau Doré */
        #golden-brain {
            position: absolute; font-size: 40px; cursor: pointer; transition: transform 0.2s; z-index: 5;
        }
        #golden-brain:hover { transform: scale(1.2); }

        /* --- Styles des Pop-ups Modales (Mini-Jeu et Succès) --- */
        .modal-popup { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; 
            flex-direction: column; z-index: 10;
        }
        .modal-content { 
            background-color: #2c3e50; padding: 20px; border-radius: 10px; 
            text-align: center; width: 80%; max-width: 400px; position: relative;
        }
        .close-button {
            position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; color: #fff;
        }

        #achievements-list li {
            text-align: left; margin: 5px 0; padding-left: 20px; list-style: disc;
        }
        #achievements-list li.unlocked { color: #2ecc71; }


        @media (min-width: 768px) {
            #game-wrapper { flex-direction: row; }
            #left-panel { flex-basis: 60%; padding: 20px; border-right: 2px solid #1a242f; border-bottom: none; }
            #right-panel { flex-basis: 40%; padding: 10px; height: 600px; }
            #score-display { font-size: 48px; }
            .brain-emoji { font-size: 180px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="left-panel">
            <h1>Brainrot Clicker</h1>
            <div id="stats-display">
                <div id="score-display"><span id="score">0</span> points</div>
                <div id="cpc-display">Points/Clic: <span id="cpc">1</span></div>
                <div id="cps-display">Auto-clics/sec: <span id="cps">0</span></div>
            </div>
            
            <button id="click-button" onclick="augmenterScoreManuel()">
                <span id="current-skin" class="brain-emoji">🧠</span>
            </button>
            <p><small id="save-status">Jeu non sauvegardé.</small></p>

            <button onclick="showAchievementsModal()">Afficher les succès débloqués</button>
        </div>

        <div id="right-panel">
             <div id="cpc-upgrades-container" class="control-container">
                <h3>Améliorations Clic (CPC)</h3>
                <div id="cpc-upgrade-shop"></div>
            </div>

            <div id="upgrades-container" class="control-container">
                <h3>Améliorations CPS</h3>
                <div id="upgrade-shop"></div>
            </div>
            
            <button id="minigame-main-button" onclick="showMinigameChoices()"> Lancer Défi de Vol (Prêt) ⚡ </button>

            <div id="skins-container" class="control-container">
                <h3>Skins Multiplicateurs</h3>
                <div id="skin-shop"></div>
            </div>
            
            <a href="discord.gg" target="_blank" rel="noopener noreferrer" class="discord-link-button" id="discord-button">
                Rejoindre Discord
            </a>

            <button id="reset-button" onclick="resetGame()"> Réinitialiser le jeu </button>
        </div>
    </div>

    <!-- Modale du Mini-Jeu -->
    <div id="minigame-popup" class="modal-popup">
        <div id="minigame-content" class="modal-content">
             <span class="close-button" onclick="closeMinigameChoices()">&times;</span>
            <h2 id="minigame-title">Choisissez votre défi de vol</h2>
            <div id="challenge-choices">
                <button class="challenge-button" onclick="startChallenge(20, 5, 50)">20 clics en 5s (+50 points)</button>
                <button class="challenge-button" onclick="startChallenge(40, 10, 100)">40 clics en 10s (+100 points)</button>
                <button class="challenge-button" onclick="startChallenge(80, 25, 350)">80 clics en 25s (+350 points)</button>
            </div>
            <div id="challenge-active-area" style="display: none;">
                <p>Objectif: <span id="clicks-required-display">0</span> clics | Temps restant: <span id="time-left">0.0</span>s</p>
                <p>Comptage : <span id="clicks-made">0</span></p>
                <button id="minigame-click-button" onclick="handleMinigameClick()"> ⚡ </button>
            </div>
        </div>
    </div>

    <!-- Modale des Succès -->
    <div id="achievements-popup" class="modal-popup">
        <div id="achievements-content" class="modal-content">
            <span class="close-button" onclick="closeAchievementsModal()">&times;</span>
            <h2>Succès débloqués</h2>
            <ul id="achievements-list">
                <!-- Les succès sont générés ici par JS -->
            </ul>
        </div>
    </div>


    <script>
        // --- Variables Globales ---
        let score = 0; let clicksPerClick = 1; let baseAutoClickRate = 0; 
        let skinMultiplier = 1; 
        let currentSkinEmoji = '🧠'; 

        let lastCooldownEndTimestamp = 0; let goldenBrainsClicked = 0; let goldenBrainTimeout;
        let minigameActive = false; let minigameClicksMade = 0; let minigameInterval; let currentChallenge = {};
        
        const SOUND_CLICK = ''; const SOUND_ACHIEVEMENT = ''; const SOUND_EVENT = '';
        function playSound(url) { if (url) { const audio = new Audio(url); audio.play(); } }

        // --- Définitions des Boutiques et Succès (BEAUCOUP PLUS D'ÉLÉMENTS AJOUTÉS) ---

        const cpcUpgrades = [
            { id: 'cpc1', name: 'Pouvoir du Clic x2', baseCost: 10, costMultiplier: 1.5, cpcBoost: 1, owned: 0 },
            { id: 'cpc2', name: 'Pouvoir du Clic x5', baseCost: 100, costMultiplier: 1.5, cpcBoost: 4, owned: 0 },
            { id: 'cpc3', name: 'Pouvoir du Clic x10', baseCost: 1000, costMultiplier: 1.5, cpcBoost: 9, owned: 0 },
            { id: 'cpc4', name: 'Pouvoir du Clic x20', baseCost: 5000, costMultiplier: 1.5, cpcBoost: 19, owned: 0 },
            { id: 'cpc5', name: 'Pouvoir du Clic x50', baseCost: 25000, costMultiplier: 1.5, cpcBoost: 49, owned: 0 },
            { id: 'cpc6', name: 'Pouvoir du Clic x100', baseCost: 100000, costMultiplier: 1.5, cpcBoost: 99, owned: 0 },
            { id: 'cpc7', name: 'Frappe Cérébrale', baseCost: 500000, costMultiplier: 1.5, cpcBoost: 450, owned: 0 },
            { id: 'cpc8', name: 'Implosion Neuronale', baseCost: 2000000, costMultiplier: 1.5, cpcBoost: 1800, owned: 0 },
            { id: 'cpc9', name: 'Maître Clickeur', baseCost: 10000000, costMultiplier: 1.5, cpcBoost: 9000, owned: 0 },
        ];

        const upgrades = [
            { id: 'auto1', name: 'Bot Simple', baseCost: 15, costMultiplier: 1.1, cps: 0.1, owned: 0 },
            { id: 'auto2', name: 'Ferme à Cerveaux', baseCost: 100, costMultiplier: 1.1, cps: 0.5, owned: 0 },
            { id: 'auto3', name: 'Influenceur TikTok', baseCost: 1000, costMultiplier: 1.1, cps: 5, owned: 0 },
            { id: 'auto4', name: 'Usine à Mèmes', baseCost: 5000, costMultiplier: 1.1, cps: 25, owned: 0 },
            { id: 'auto5', name: 'Centre de Recherche', baseCost: 25000, costMultiplier: 1.1, cps: 120, owned: 0 },
            { id: 'auto6', name: 'Data Center Global', baseCost: 100000, costMultiplier: 1.1, cps: 500, owned: 0 },
            { id: 'auto7', name: 'IA Générative', baseCost: 500000, costMultiplier: 1.1, cps: 2500, owned: 0 },
            { id: 'auto8', name: 'Singularité Numérique', baseCost: 2000000, costMultiplier: 1.1, cps: 10000, owned: 0 },
            { id: 'auto9', name: 'Conscience Collective', baseCost: 10000000, costMultiplier: 1.1, cps: 50000, owned: 0 },
        ];

        const skins = [
            { id: 'skin1', name: 'Cerveau Normal', emoji: '🧠', multiplier: 1, cost: 0, owned: true },
            { id: 'skin2', name: 'Cerveau Lumineux', emoji: '💡', multiplier: 1.5, cost: 1000, owned: false },
            { id: 'skin3', name: 'Cerveau Doré', emoji: '🌟', multiplier: 2.0, cost: 5000, owned: false },
            { id: 'skin4', name: 'Cerveau Maléfique', emoji: '😈', multiplier: 3.0, cost: 25000, owned: false },
            { id: 'skin5', name: 'Cerveau Glacé', emoji: '🧊', multiplier: 4.0, cost: 100000, owned: false },
            { id: 'skin6', name: 'Cerveau Arc-en-ciel', emoji: '🌈', multiplier: 6.0, cost: 500000, owned: false },
            { id: 'skin7', name: 'Cerveau Hacker', emoji: '💻', multiplier: 8.0, cost: 2000000, owned: false },
            { id: 'skin8', name: 'Cerveau Cosmique', emoji: '🌌', multiplier: 10.0, cost: 5000000, owned: false },
            { id: 'skin9', name: 'Cerveau de Diamant', emoji: '💎', multiplier: 15.0, cost: 25000000, owned: false },
            { id: 'skin10', name: 'Cerveau Ultime', emoji: '🤯', multiplier: 25.0, cost: 100000000, owned: false },
        ];

        const achievements = [
            { id: 'start', name: 'Le Commencement', description: 'Atteindre 100 points.', requirement: 100, unlocked: false },
            { id: 'thousand', name: 'Quatre Chiffres', description: 'Atteindre 1 000 points.', requirement: 1000, unlocked: false },
            { id: 'million', name: 'Tycoon Cérébral', description: 'Atteindre 1 million de points.', requirement: 1000000, unlocked: false },
            { id: 'billion', name: 'Milliardaire de la Tête', description: 'Atteindre 1 milliard de points.', requirement: 1000000000, unlocked: false },
            { id: 'gclick', name: 'Chasseur de Trésor', description: 'Cliquer sur 5 cerveaux dorés.', requirement: 5, statToTrack: 'goldenBrainsClicked', unlocked: false },
            { id: 'gclicker2', name: 'Collectionneur d\'Étoiles', description: 'Cliquer sur 50 cerveaux dorés.', requirement: 50, statToTrack: 'goldenBrainsClicked', unlocked: false },
        ];

        function updateUI() {
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('cpc').textContent = Math.floor(clicksPerClick * skinMultiplier);
            document.getElementById('cps').textContent = (baseAutoClickRate * skinMultiplier).toFixed(1);
            document.getElementById('current-skin').textContent = currentSkinEmoji;
            renderShop(cpcUpgrades, 'cpc-upgrade-shop', buyCpcUpgrade);
            renderShop(upgrades, 'upgrade-shop', buyUpgrade);
            renderSkins();
            checkAchievements();
        }
        
        function renderShop(items, containerId, buyFunction) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const cost = Math.floor(item.baseCost * Math.pow(item.costMultiplier, item.owned));
                const button = document.createElement('button');
                button.innerHTML = `${item.name} | Coût: ${cost.toLocaleString()} pts | Possédé: ${item.owned}`;
                button.disabled = score < cost;
                button.onclick = () => buyFunction(item.id);
                container.appendChild(button);
            });
        }

        function renderSkins() {
            const container = document.getElementById('skin-shop');
            container.innerHTML = '';
            skins.forEach(skin => {
                const button = document.createElement('button');
                if (skin.owned) {
                    if (currentSkinEmoji === skin.emoji) {
                         button.disabled = true;
                         button.innerHTML = `${skin.emoji} ${skin.name} (Équipé)`;
                    } else {
                        button.innerHTML = `${skin.emoji} ${skin.name} (x${skin.multiplier}) - ÉQUIPER`;
                        button.onclick = () => equipSkin(skin.id);
                    }
                } else {
                    button.innerHTML = `${skin.emoji} ${skin.name} | Coût: ${skin.cost.toLocaleString()} pts`;
                    button.disabled = score < skin.cost;
                    button.onclick = () => buySkin(skin.id);
                }
                container.appendChild(button);
            });
        }

        function renderAchievementsListInModal() {
            const list = document.getElementById('achievements-list');
            list.innerHTML = '';
            achievements.forEach(ach => {
                const li = document.createElement('li');
                li.textContent = `${ach.name}: ${ach.description}`;
                if (ach.unlocked) {
                    li.classList.add('unlocked');
                    li.textContent += ' (DÉBLOQUÉ)';
                }
                list.appendChild(li);
            });
        }
        
        function augmenterScoreManuel() {
            if (minigameActive) return;
            score += clicksPerClick * skinMultiplier;
            const button = document.getElementById('click-button');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => button.style.transform = 'scale(1)', 100);
            playSound(SOUND_CLICK);
            updateUI();
        }

        function autoClick() {
            score += baseAutoClickRate * skinMultiplier;
            checkAchievements();
        }

        function buyCpcUpgrade(id) {
            const item = cpcUpgrades.find(i => i.id === id);
            const cost = Math.floor(item.baseCost * Math.pow(item.costMultiplier, item.owned));
            if (score >= cost) {
                score -= cost;
                item.owned++;
                clicksPerClick += item.cpcBoost;
                updateUI();
            }
        }

        function buyUpgrade(id) {
            const item = upgrades.find(i => i.id === id);
            const cost = Math.floor(item.baseCost * Math.pow(item.costMultiplier, item.owned));
            if (score >= cost) {
                score -= cost;
                item.owned++;
                baseAutoClickRate += item.cps;
                updateUI();
            }
        }

        function buySkin(id) {
            const skin = skins.find(s => s.id === id);
            if (score >= skin.cost && !skin.owned) {
                score -= skin.cost;
                skin.owned = true;
                equipSkin(id);
                updateUI();
            }
        }

        function equipSkin(id) {
            const skin = skins.find(s => s.id === id);
            if (skin.owned) {
                currentSkinEmoji = skin.emoji;
                skinMultiplier = skin.multiplier;
                updateUI();
            }
        }

        function checkAchievements() {
            achievements.forEach(ach => {
                if (!ach.unlocked) {
                    let valueToCheck = score;
                    if (ach.statToTrack === 'goldenBrainsClicked') {
                        valueToCheck = goldenBrainsClicked;
                    }
                    
                    if (valueToCheck >= ach.requirement) {
                        ach.unlocked = true;
                        playSound(SOUND_ACHIEVEMENT);
                        console.log(`SUCCÈS DÉBLOQUÉ : ${ach.name}`);
                    }
                }
            });
        }

        function saveGame() {
            const saveData = {
                score: score, clicksPerClick: clicksPerClick, baseAutoClickRate: baseAutoClickRate, skinMultiplier: skinMultiplier,
                currentSkinEmoji: currentSkinEmoji, cpcUpgrades: cpcUpgrades, upgrades: upgrades, skins: skins,
                achievements: achievements, goldenBrainsClicked: goldenBrainsClicked,
            };
            localStorage.setItem('brainrotClickerSave', JSON.stringify(saveData));
            document.getElementById('save-status').textContent = 'Jeu sauvegardé !';
            setTimeout(() => document.getElementById('save-status').textContent = 'Jeu non sauvegardé.', 2000);
        }

        function loadGame() {
            const savedData = localStorage.getItem('brainrotClickerSave');
            if (savedData) {
                const data = JSON.parse(savedData);
                score = data.score; clicksPerClick = data.clicksPerClick; baseAutoClickRate = data.baseAutoClickRate; 
                skinMultiplier = data.skinMultiplier; currentSkinEmoji = data.currentSkinEmoji;
                goldenBrainsClicked = data.goldenBrainsClicked || 0;
                
                if (data.cpcUpgrades) data.cpcUpgrades.forEach(s => Object.assign(cpcUpgrades.find(d => d.id === s.id) || {}, s));
                if (data.upgrades) data.upgrades.forEach(s => Object.assign(upgrades.find(d => d.id === s.id) || {}, s));
                if (data.skins) data.skins.forEach(s => Object.assign(skins.find(d => d.id === s.id) || {}, s));
                if (data.achievements) data.achievements.forEach(s => Object.assign(achievements.find(d => d.id === s.id) || {}, s));
                
                updateUI();
                console.log("Jeu chargé.");
            } else {
                equipSkin('skin1');
            }
        }

        function resetGame() {
            if (confirm("Êtes-vous sûr de vouloir réinitialiser toute votre progression ?")) {
                localStorage.removeItem('brainrotClickerSave');
                location.reload();
            }
        }
        
        function showMinigameChoices() {
            const now = Date.now();
            if (now < lastCooldownEndTimestamp) {
                alert(`Le mini-jeu est en cooldown. Revenez dans ${Math.ceil((lastCooldownEndTimestamp - now) / 1000)} secondes.`);
                return;
            }
            document.getElementById('minigame-popup').style.display = 'flex';
            document.getElementById('challenge-choices').style.display = 'block';
            document.getElementById('challenge-active-area').style.display = 'none';
        }

        function closeMinigameChoices() {
            document.getElementById('minigame-popup').style.display = 'none';
        }

        function startChallenge(required, timeLimit, reward) {
            currentChallenge = { required, timeLimit, reward };
            minigameActive = true;
            minigameClicksMade = 0;
            document.getElementById('clicks-required-display').textContent = required;
            document.getElementById('clicks-made').textContent = 0;
            document.getElementById('time-left').textContent = timeLimit.toFixed(1);
            document.getElementById('challenge-choices').style.display = 'none';
            document.getElementById('challenge-active-area').style.display = 'block';

            let timeLeft = timeLimit;
            minigameInterval = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('time-left').textContent = timeLeft.toFixed(1);
                if (timeLeft <= 0) {
                    endChallenge(false);
                }
            }, 100);
        }

        function handleMinigameClick() {
            if (!minigameActive) return;
            minigameClicksMade++;
            document.getElementById('clicks-made').textContent = minigameClicksMade;
            if (minigameClicksMade >= currentChallenge.required) {
                endChallenge(true);
            }
        }

        function endChallenge(success) {
            clearInterval(minigameInterval);
            minigameActive = false;
            document.getElementById('minigame-popup').style.display = 'none';
            
            lastCooldownEndTimestamp = Date.now() + 60000; 
            
            if (success) {
                score += currentChallenge.reward;
                console.log(`Victoire ! Vous avez gagné ${currentChallenge.reward} points !`);
            } else {
                 console.log("Temps écoulé ! Vous avez échoué au défi.");
            }
            updateUI();
        }
        
        function showAchievementsModal() {
            renderAchievementsListInModal();
            document.getElementById('achievements-popup').style.display = 'flex';
        }

        function closeAchievementsModal() {
            document.getElementById('achievements-popup').style.display = 'none';
        }

        function spawnGoldenBrain() {
            if (document.getElementById('golden-brain')) return;
            playSound(SOUND_EVENT);

            const brain = document.createElement('div');
            brain.id = 'golden-brain';
            brain.textContent = '🌟';
            brain.style.top = `${Math.random() * (window.innerHeight - 50)}px`;
            brain.style.left = `${Math.random() * (window.innerWidth - 50)}px`;
            brain.onclick = clickGoldenBrain;
            document.body.appendChild(brain);

            goldenBrainTimeout = setTimeout(() => {
                if (brain.parentNode) brain.parentNode.removeChild(brain);
            }, 5000);
        }

        function clickGoldenBrain() {
            const brain = document.getElementById('golden-brain');
            if (!brain) return;
            clearTimeout(goldenBrainTimeout);
            brain.parentNode.removeChild(brain);
            
            const pointsGained = Math.floor(score * 0.1) + 50;
            score += pointsGained;
            goldenBrainsClicked++;
            console.log(`Cerveau doré cliqué ! Vous gagnez ${pointsGained} points !`);
            updateUI();
        }
        
        setInterval(saveGame, 10000); 
        setInterval(autoClick, 100); 
        setInterval(() => {
            if (Math.random() < 0.1) spawnGoldenBrain();
        }, 30000);

        window.onload = () => {
            loadGame();
            updateUI();
        };

    </script>
</body>
</html>
