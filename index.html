<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Clicker (Fonctionnel)</title>
    <style>
        /* --- Styles Généraux (Mobile First) --- */
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #0f1821; 
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow-y: auto; 
            padding: 10px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column; 
            width: 100%;
            background-color: #2c3e50; 
            border: 2px solid #1a242f;
            border-radius: 5px;
            max-width: 1000px;
        }

        #left-panel {
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #1a242f; 
        }

        #score-display {
            font-size: 36px; 
            color: #f1c40f; 
        }

        #cps-display, #cpc-display {
            font-size: 16px;
        }

        #click-button {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, filter 0.3s;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
            margin: 10px 0;
        }

        .brain-emoji {
            font-size: 150px; 
            display: block;
        }

        #right-panel {
            padding: 10px;
            overflow-y: auto; 
            height: auto; 
        }

        .control-container h3 {
            border-bottom: 1px solid #1a242f;
            padding-bottom: 5px;
            margin-top: 15px;
            color: #61dafb; 
        }

        button {
            padding: 10px;
            background-color: #34495e; 
            border: 1px solid #1a242f;
            border-radius: 0; 
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin: 3px 0;
            width: 100%;
            text-align: left;
            transition: background-color 0.2s;
        }
        
        #minigame-main-button {
            background-color: #2ecc71; 
            text-align: center;
        }

        button:hover {
            background-color: #416080;
        }

        button:disabled {
            background-color: #34495e80; 
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* --- Styles du Pop-up Mini-Jeu --- */
        #minigame-popup {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #minigame-content {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        
        .challenge-button {
            width: 100%;
            margin: 5px 0;
            text-align: center;
            background-color: #34495e;
        }
        
        #minigame-click-button {
            width: auto !important; 
            height: auto !important;
            padding: 20px !important;
            border-radius: 50%;
            font-size: 30px;
            margin-top: 15px;
            background-color: #e74c3c;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Media Query pour PC et Grands Écrans (>= 768px) --- */
        @media (min-width: 768px) {
            #game-wrapper {
                flex-direction: row; 
            }

            #left-panel {
                flex-basis: 60%;
                padding: 20px;
                border-right: 2px solid #1a242f;
                border-bottom: none; 
            }

            #right-panel {
                flex-basis: 40%;
                padding: 10px;
                height: 600px; 
            }

            #score-display {
                font-size: 48px; 
            }

            .brain-emoji {
                font-size: 180px; 
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="left-panel">
            <h1>Brainrot Clicker</h1>
            <div id="stats-display">
                <div id="score-display"><span id="score">0</span> points</div>
                <div id="cpc-display">Points/Clic: <span id="cpc">1</span></div>
                <div id="cps-display">Auto-clics/sec: <span id="cps">0</span></div>
            </div>
            
            <button id="click-button" onclick="augmenterScoreManuel()">
                <span id="current-skin" class="brain-emoji">🧠</span>
            </button>
        </div>

        <div id="right-panel">
            <div id="upgrades-container" class="control-container">
                <h3>Améliorations CPS</h3>
                <div id="upgrade-shop">
                    <!-- Les boutons d'améliorations sont générés par JS -->
                </div>
            </div>
            
            <button id="minigame-main-button" onclick="showMinigameChoices()">
                Lancer Défi de Vol (Prêt) 🧠⚡
            </button>

            <div id="skins-container" class="control-container">
                <h3>Skins Multiplicateurs</h3>
                <div id="skin-shop">
                    <!-- Les boutons de skin sont générés par JS -->
                </div>
            </div>

            <button id="reset-button" onclick="resetGame()">
                Réinitialiser le jeu
            </button>
        </div>
    </div>

    <!-- Interface du Pop-up de Choix et Défi -->
    <div id="minigame-popup">
        <div id="minigame-content">
            <h2 id="minigame-title">Choisissez votre défi de vol</h2>
            
            <div id="challenge-choices">
                <button class="challenge-button" onclick="startChallenge(20, 5, 50)">20 clics en 5s (+50 points)</button>
                <button class="challenge-button" onclick="startChallenge(40, 10, 100)">40 clics en 10s (+100 points)</button>
                <button class="challenge-button" onclick="startChallenge(80, 25, 350)">80 clics en 25s (+350 points)</button>
            </div>

            <div id="challenge-active-area" style="display: none;">
                <p>Objectif: <span id="clicks-required-display">0</span> clics | Temps restant: <span id="time-left">0.0</span>s</p>
                <p>Comptage : <span id="clicks-made">0</span></p>
                <button id="minigame-click-button" onclick="handleMinigameClick()">
                    ⚡
                </button>
            </div>
            
        </div>
    </div>


    <script>
        // Logique JavaScript
        let score = 0;
        let clicksPerClick = 1; 
        let baseAutoClickRate = 0; 
        let skinMultiplier = 1; 
        let minigameActive = false;
        let minigameClicksMade = 0;
        let minigameInterval;
        let currentChallenge = {};
        let hasPlayedMinigame = false; 

        const upgrades = [
            { id: 'assistant', name: 'Assistant', baseCost: 10, cps: 1, count: 0 },
            { id: 'generator', name: 'Générateur', baseCost: 100, cps: 10, count: 0 },
            { id: 'factory', name: 'Usine à Cerveaux', baseCost: 500, cps: 50, count: 0 },
            { id: 'lab', name: 'Laboratoire Secret', baseCost: 2000, cps: 100, count: 0 },
            { id: 'server', name: 'Serveur IA', baseCost: 10000, cps: 200, count: 0 },
            { id: 'farm', name: 'Ferme de Minage', baseCost: 50000, cps: 500, count: 0 },
            { id: 'portal', name: 'Portes Spatio-temporelles', baseCost: 250000, cps: 1000, count: 0 },
            { id: 'reality', name: 'Machine à Réalité', baseCost: 1000000, cps: 5000, count: 0 },
            { id: 'singularity', name: 'Singularité', baseCost: 5000000, cps: 10000, count: 0 },
            { id: 'nexus', name: 'Nexus Cosmique', baseCost: 25000000, cps: 50000, count: 0 }
        ];

        const skins = [
            { id: 'normal', emoji: '🧠', cost: 0, multiplier: 1, owned: true },
            { id: 'gold', emoji: '💛', cost: 1000, multiplier: 2, owned: false },
            { id: 'rainbow', emoji: '🌈', cost: 10000, multiplier: 5, owned: false }
        ];
        let currentSkin = skins.find(s => s.id === 'normal');

        const scoreElement = document.getElementById('score');
        const cpsElement = document.getElementById('cps');
        const cpcElement = document.getElementById('cpc');
        const minigameMainButton = document.getElementById('minigame-main-button');
        const minigamePopup = document.getElementById('minigame-popup');
        const challengeChoicesArea = document.getElementById('challenge-choices');
        const challengeActiveArea = document.getElementById('challenge-active-area');


        function augmenterScoreManuel() {
            score += clicksPerClick;
            updateDisplay();
        }

        function augmenterScoreAutomatique() {
            let totalCps = baseAutoClickRate * skinMultiplier;
            score += totalCps;
            updateDisplay();
        }
        
        // --- Logique du Mini-Jeu ---

        function showMinigameChoices() {
            if (minigameMainButton.disabled) return;
            minigamePopup.style.display = 'flex';
            challengeChoicesArea.style.display = 'block';
            challengeActiveArea.style.display = 'none';
        }

        function startChallenge(requiredClicks, timeLimitSeconds, rewardAmount) {
            if (minigameActive) return;

            challengeChoicesArea.style.display = 'none';
            challengeActiveArea.style.display = 'block';

            currentChallenge = { required: requiredClicks, time: timeLimitSeconds, reward: rewardAmount };
            minigameActive = true;
            minigameClicksMade = 0;
            // Assure que les éléments DOM sont bien trouvés et mis à jour
            document.getElementById('time-left').textContent = currentChallenge.time.toFixed(1);
            document.getElementById('clicks-made').textContent = minigameClicksMade;
            document.getElementById('clicks-required-display').textContent = currentChallenge.required;
            
            let timeLeft = currentChallenge.time;
            minigameInterval = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('time-left').textContent = timeLeft.toFixed(1);
                if (timeLeft <= 0) {
                    clearInterval(minigameInterval);
                    endMinigame(false);
                }
            }, 100);
        }

        function handleMinigameClick() {
            if (!minigameActive) return;

            minigameClicksMade++;
            document.getElementById('clicks-made').textContent = minigameClicksMade;

            if (minigameClicksMade >= currentChallenge.required) {
                clearInterval(minigameInterval);
                endMinigame(true);
            }
        }

        function endMinigame(won) {
            minigameActive = false;
            minigamePopup.style.display = 'none'; 

            if (won) {
                score += currentChallenge.reward;
                alert(`VICTOIRE ! Vous avez volé ${currentChallenge.reward.toLocaleString()} points bonus !`);
            } else {
                alert("TEMPS ÉCOULÉ ou objectif non atteint ! Vous n'avez rien volé cette fois-ci.");
            }
            
            hasPlayedMinigame = true;
            applyCooldown();
            updateDisplay();
        }
        
        function applyCooldown() {
            const COOLDOWN_TIME = 900000; // 15 minutes en ms
            minigameMainButton.disabled = true;
            minigameMainButton.textContent = "Prochain vol dans 15 minutes...";

            setTimeout(() => {
                minigameMainButton.disabled = false;
                minigameMainButton.textContent = "Lancer Défi de Vol (Prêt) 🧠⚡";
            }, COOLDOWN_TIME);
        }

        // --- Fin Logique du Mini-Jeu ---


        function buyUpgrade(upgradeId) {
            const upgrade = upgrades.find(u => u.id === upgradeId);
            const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count));
            if (score >= currentCost) {
                score -= currentCost;
                upgrade.count += 1;
                baseAutoClickRate += upgrade.cps;
                updateDisplay();
                renderUpgradeShop();
            }
        }
        
        function renderUpgradeShop() {
            const upgradeShopElement = document.getElementById('upgrade-shop');
            upgradeShopElement.innerHTML = '';
            upgrades.forEach(upgrade => {
                const currentCost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count));
                const button = document.createElement('button');
                button.innerHTML = `${upgrade.name} (+${upgrade.cps} CPS) (Coût: ${currentCost.toLocaleString()}, Possédé: ${upgrade.count})`;
                button.onclick = () => buyUpgrade(upgrade.id);
                button.disabled = (score < currentCost);
                upgradeShopElement.appendChild(button);
            });
        }
        
        function buySkin(skinId) {
            const skin = skins.find(s => s.id === skinId);
            if (skin && !skin.owned && score >= skin.cost) {
                score -= skin.cost;
                skin.owned = true;
                useSkin(skinId);
                updateDisplay();
                renderSkinShop();
            }
        }

        function useSkin(skinId) {
            const skin = skins.find(s => s.id === skinId);
            if (skin && skin.owned) {
                currentSkin = skin;
                skinMultiplier = skin.multiplier;
                document.getElementById('current-skin').textContent = skin.emoji;
                updateDisplay();
            }
        }

        function renderSkinShop() {
            const skinShopElement = document.getElementById('skin-shop');
            skinShopElement.innerHTML = '';
            skins.forEach(skin => {
                const button = document.createElement('button');
                if (skin.owned) {
                    button.textContent = `Utiliser ${skin.emoji} (x${skin.multiplier} CPS)`;
                    button.onclick = () => useSkin(skin.id);
                    if (currentSkin.id === skin.id) {
                        button.disabled = true;
                    }
                } else {
                    button.textContent = `Acheter ${skin.emoji} (Coût: ${skin.cost.toLocaleString()}, x${skin.multiplier} CPS)`;
                    button.onclick = () => buySkin(skin.id);
                    button.disabled = (score < skin.cost);
                }
                skinShopElement.appendChild(button);
            });
        }

        function resetGame() {
            score = 0;
            clicksPerClick = 1;
            baseAutoClickRate = 0;
            skinMultiplier = 1;
            hasPlayedMinigame = false;
            upgrades.forEach(u => u.count = 0);
            skins.forEach((s, index) => s.owned = (index === 0));
            useSkin('normal');
            
            // Au reset, le bouton est immédiatement disponible 
            minigameMainButton.disabled = false;
            minigameMainButton.textContent = "Lancer Défi de Vol (Prêt) 🧠⚡";

            updateDisplay();
            renderUpgradeShop();
            renderSkinShop();
        }

        function updateDisplay() {
            scoreElement.textContent = score.toLocaleString();
            cpsElement.textContent = (baseAutoClickRate * skinMultiplier).toLocaleString(); 
            cpcElement.textContent = clicksPerClick;
            
            renderUpgradeShop();
            renderSkinShop(); 
        }

        setInterval(augmenterScoreAutomatique, 1000);
        
        resetGame(); 
        updateDisplay();
    </script>

</body>
</html>
